name: vLLM Benchmark

on:
  workflow_dispatch:
    inputs:
      vllm_branch:
        description: >
          vLLM branch to benchmark (main, or refs/pull/PR_NUMBER/head for
          pre-merge check)
        required: true
        type: string
        default: main
      vllm_commit:
        description: >
          vLLM commit SHA (optional, defaults to latest on the branch)
        required: false
        type: string
      models:
        description: >
          Comma-separated list of models to benchmark (optional, default all)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # ─── Generate benchmark matrix from spyre config files ───
  set-parameters:
    runs-on: ubuntu-latest
    outputs:
      benchmark_matrix: ${{ steps.set-parameters.outputs.benchmark_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate benchmark matrix
        id: set-parameters
        env:
          MODELS: ${{ inputs.models || '' }}
        run: |
          set -eux
          python .github/scripts/generate_vllm_benchmark_matrix.py \
            --benchmark-configs-dir vllm-benchmarks/benchmarks \
            --models "${MODELS}"

  # ─── Run vLLM benchmarks on Spyre hardware ───
  benchmarks:
    name: Run vLLM benchmarks (${{ matrix.models }})
    needs: set-parameters
    strategy:
      matrix: ${{ fromJson(needs.set-parameters.outputs.benchmark_matrix) }}
      fail-fast: false
    runs-on:
      - x86_64
      - spyre_pf_x1
      - linux
      - image_spyre_inference
    timeout-minutes: 240
    env:
      CI: ''
      CLONED_SPYRE_INFERENCE_DIR: /home/senuser/spyre-inference
      VLLM_CPU_KVCACHE_SPACE: '16'
      DTLOG_LEVEL: error
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout composite actions and scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            .github/scripts
            vllm-benchmarks
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/checkout-prebuilt-spyre-inference

      - uses: ./.github/actions/build-spyre-inference

      - name: Checkout vLLM repository
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          path: vllm-checkout
          ref: ${{ inputs.vllm_branch || 'main' }}
          fetch-depth: 0

      - name: Resolve vLLM commit
        env:
          HEAD_SHA: ${{ inputs.vllm_commit || '' }}
        run: |
          set -eux

          if [[ -z "${HEAD_SHA}" ]]; then
            # Use latest commit on the branch
            HEAD_SHA=$(cd vllm-checkout && git rev-parse HEAD)
          else
            cd vllm-checkout
            git checkout "${HEAD_SHA}"
            cd ..
          fi

          echo "HEAD_SHA=$HEAD_SHA" >> $GITHUB_ENV
          echo "### Benchmarking vLLM [${HEAD_SHA}](https://github.com/vllm-project/vllm/commit/${HEAD_SHA})" >> "${GITHUB_STEP_SUMMARY}"

      - name: Setup benchmark configs
        env:
          MODELS: ${{ matrix.models }}
        run: |
          set -eux

          # Clear existing benchmark test configs in vLLM checkout
          rm -f vllm-checkout/.buildkite/performance-benchmarks/tests/*.json || true
          mkdir -p vllm-checkout/.buildkite/performance-benchmarks/tests

          # Copy our spyre benchmark configs into vLLM's expected directory
          python3 .github/scripts/setup_vllm_benchmark.py \
            --from-benchmark-configs-dir vllm-benchmarks/benchmarks \
            --to-benchmark-configs-dir vllm-checkout/.buildkite/performance-benchmarks/tests \
            --models "${MODELS}" \
            --device spyre

          echo "=== Benchmark configs ==="
          ls -lah vllm-checkout/.buildkite/performance-benchmarks/tests/
          find vllm-checkout/.buildkite/performance-benchmarks/tests -type f -exec cat {} \;

      - name: Install benchmark dependencies
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          cd "$CLONED_SPYRE_INFERENCE_DIR"
          source .venv/bin/activate
          pip install -r "${GITHUB_WORKSPACE}/.github/scripts/requirements-benchmark.txt"

      - name: Run vLLM benchmarks
        env:
          ENGINE_VERSION: v1
          SAVE_TO_PYTORCH_BENCHMARK_FORMAT: 1
          DEVICE_NAME: spyre
          DEVICE_TYPE: IBM_Spyre
          TRANSFORMERS_OFFLINE: '0'
        run: |
          set -eux

          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          cd "$CLONED_SPYRE_INFERENCE_DIR"
          source .venv/bin/activate

          # Run from the vLLM checkout directory
          cd "${GITHUB_WORKSPACE}/vllm-checkout"
          bash .buildkite/performance-benchmarks/scripts/run-performance-benchmarks.sh

      - name: Check benchmark results
        env:
          BENCHMARK_RESULTS: vllm-checkout/benchmarks/results
        run: |
          set -eux

          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          cd "$CLONED_SPYRE_INFERENCE_DIR"
          source .venv/bin/activate

          cd "${GITHUB_WORKSPACE}"
          ls -lah "${BENCHMARK_RESULTS}" || true

          python3 .github/scripts/check_benchmark_results.py \
            --benchmark-results "${BENCHMARK_RESULTS}" \
            --strict

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results--${{ matrix.models }}
          path: vllm-checkout/benchmarks/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          RESULTS_DIR="${GITHUB_WORKSPACE}/vllm-checkout/benchmarks/results"
          RESULT_COUNT=$(find "$RESULTS_DIR" -name "*.json" 2>/dev/null | wc -l || echo 0)

          {
            echo "### Benchmark Results"
            echo ""
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| vLLM Branch | ${{ inputs.vllm_branch || 'main' }} |"
            echo "| vLLM Commit | ${HEAD_SHA:-unknown} |"
            echo "| Models | ${{ matrix.models }} |"
            echo "| Result Files | ${RESULT_COUNT} |"
            echo "| Run ID | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
