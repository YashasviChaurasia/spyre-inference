apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      initContainers:
        - name: copy-and-patch
          image: {{ .Values.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp -r /usr/share/nginx/html/* /html/
              INDEX=/html/index.html
              sed -i "s|name=\"spyre-ch-url\" content=\"\"|name=\"spyre-ch-url\" content=\"${CH_URL}\"|" "$INDEX"
              sed -i "s|name=\"spyre-ch-user\" content=\"default\"|name=\"spyre-ch-user\" content=\"${CH_USER}\"|" "$INDEX"
              sed -i "s|name=\"spyre-ch-token\" content=\"\"|name=\"spyre-ch-token\" content=\"${CH_PASSWORD}\"|" "$INDEX"
              sed -i "s|name=\"spyre-ch-db\" content=\"vllm_benchmarks\"|name=\"spyre-ch-db\" content=\"${CH_DB}\"|" "$INDEX"
              sed -i "s|name=\"github-client-id\" content=\"\"|name=\"github-client-id\" content=\"${GITHUB_CLIENT_ID}\"|" "$INDEX"
              echo "Config injected into index.html"
              cat "$INDEX" | grep meta
          env:
            - name: CH_URL
              value: {{ .Values.clickhouse.url | quote }}
            - name: CH_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CH_PASSWORD
              value: {{ .Values.secrets.clickhousePassword | quote }}
            - name: CH_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: GITHUB_CLIENT_ID
              value: {{ .Values.github.clientId | quote }}
          volumeMounts:
            - name: html
              mountPath: /html
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: {{ .Values.port }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: html
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-nginx
